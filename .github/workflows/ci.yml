name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Ruff Linter
        run: uv run ruff check .
      - name: Run Mypy Type Checker
        run: uv run mypy src
      - name: Run Pytest with Coverage
        run: uv run pytest --cov=src --cov-report=term-missing
      - name: Check Version Bump in pyproject.toml
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          OLD_VERSION=$(git show origin/main:pyproject.toml | python3 -c "import re, sys; print(re.search(r'^version\s*=\s*[\"']([^\"']+)[\"']', sys.stdin.read(), re.M).group(1))")
          NEW_VERSION=$(python3 -c "import re; print(re.search(r'^version\s*=\s*[\"']([^\"']+)[\"']', open('pyproject.toml').read(), re.M).group(1))")
          echo "main branch version: $OLD_VERSION"
          echo "PR branch version:   $NEW_VERSION"
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::Version in pyproject.toml has not been updated! (Current: $OLD_VERSION). Please bump the version before merging to main."
            exit 1
          fi

