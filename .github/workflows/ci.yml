name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Install Playwright Browsers
        run: uv run playwright install --with-deps chromium
      - name: Run Ruff Formatter Check
        run: uv run ruff format --check
      - name: Run Ruff Linter
        run: uv run ruff check .
      - name: Run Mypy Type Checker
        run: uv run mypy src
      - name: Run Pytest with Coverage
        run: uv run pytest --cov=src --cov-report=term-missing
      - name: Check Version Bump in pyproject.toml
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_CODE_FILES=$(git diff --name-only origin/main...HEAD | grep -vE '^(docs/|\.vscode/|\.githooks/|\.github/|\.gitignore|.*\.md$)' || true)
          if [ -z "$CHANGED_CODE_FILES" ]; then
            echo "ℹ️ Only documentation or non-code files changed. Version bump not required."
            exit 0
          fi

          OLD_VERSION=$(git show origin/main:pyproject.toml | uv run python -c "import tomllib, sys; print(tomllib.loads(sys.stdin.read())['project']['version'])")
          NEW_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "main branch version: $OLD_VERSION"
          echo "PR branch version:   $NEW_VERSION"

          IS_GREATER=$(uv run python -c "from packaging.version import Version; print('true' if Version('$NEW_VERSION') > Version('$OLD_VERSION') else 'false')")
          if [ "$IS_GREATER" = "false" ]; then
            echo "::error::Code changes detected but version in pyproject.toml ($NEW_VERSION) is not greater than main branch ($OLD_VERSION)! Please bump the version before merging to main."
            exit 1
          fi

          IS_VALID_FORMAT=$(uv run python -c "import re; print('true' if re.match(r'^[0-9]+\.[0-9]+\.[0-9]+$', '$NEW_VERSION') else 'false')")
          if [ "$IS_VALID_FORMAT" = "false" ]; then
            echo "::error::Version '$NEW_VERSION' in pyproject.toml does not match required x.x.x layout for main branch (e.g. 1.0.0, 1.0.1). Pre-release suffixes like 'rc' are not permitted on main."
            exit 1
          fi

          IS_IN_CHANGELOG=$(uv run python -c "import re; content=open('CHANGELOG.md', encoding='utf-8').read(); print('true' if re.search(r'##\s*\[?v?' + re.escape('$NEW_VERSION') + r'\]?', content) else 'false')")
          if [ "$IS_IN_CHANGELOG" = "false" ]; then
            echo "::error::Version '$NEW_VERSION' from pyproject.toml was not found in CHANGELOG.md! Please add release notes for [$NEW_VERSION] in CHANGELOG.md before merging to main."
            exit 1
          fi

