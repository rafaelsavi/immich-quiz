name: CI/CD Pipeline

on:
  push:
    branches: [ main, rc ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # STAGE 1: VALIDATE (Runs on EVERY PR and EVERY push to main)
  # ============================================================================
  validate:
    name: Validate (Format, Lint, Types, Tests & Version)
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_release.outputs.should_release }}
      version: ${{ steps.check_release.outputs.version }}
      tag: ${{ steps.check_release.outputs.tag }}
      is_official: ${{ steps.check_release.outputs.is_official }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies & Playwright browser
        run: |
          uv sync --extra dev
          uv run playwright install --with-deps chromium

      - name: Run Unified Verification Suite
        run: uv run python scripts/verify.py --ci

      - name: Evaluate Release Readiness
        id: check_release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          uv run python -c "
          import tomllib, os, re, subprocess
          from pathlib import Path

          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = f'v{version}'
          is_official = 'true' if re.match(r'^[0-9]+\.[0-9]+\.[0-9]+$', version) else 'false'

          # Check if tag already exists on remote origin
          result = subprocess.run(['git', 'ls-remote', '--tags', 'origin', f'refs/tags/{tag}'], capture_output=True, text=True)
          tag_exists = bool(result.stdout.strip())

          # Only release if tag does not exist yet on remote
          should_release = 'true' if not tag_exists else 'false'
          print(f'Version: {version}, Tag: {tag}, Remote Tag Exists: {tag_exists}, Should Release: {should_release}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\n')
              f.write(f'tag={tag}\n')
              f.write(f'is_official={is_official}\n')
              f.write(f'should_release={should_release}\n')
          "

  # ============================================================================
  # STAGE 2: RELEASE (Runs ONLY if validate succeeded, on main, and version is new)
  # ============================================================================
  release:
    name: Create Tag & GitHub Release
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          uv run python -c "
          import re, os
          from pathlib import Path
          content = Path('CHANGELOG.md').read_text(encoding='utf-8')
          version = os.environ['VERSION']
          pattern = rf'##\s*\[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else ''
          Path('release_notes.md').write_text(notes, encoding='utf-8')
          "
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Create Git Tag
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG" || echo "::warning::Direct git push failed; tag will be created by action-gh-release."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.validate.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ needs.validate.outputs.is_official == 'false' }}
          make_latest: ${{ needs.validate.outputs.is_official == 'true' }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 3: DOCKER (Runs ONLY if release succeeded)
  # ============================================================================
  docker:
    name: Build & Publish Multi-Arch Docker
    needs: [validate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ needs.validate.outputs.is_official == 'true' }}
            type=raw,value=${{ needs.validate.outputs.tag }}
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=rc,enable=${{ needs.validate.outputs.is_official == 'false' }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
