name: Auto Release

on:
  push:
    branches:
      - main
      - rc
      - 'release/**'
      - 'rc/**'
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.vscode/**'
      - '.githooks/**'
      - '.github/CODEOWNERS'

permissions:
  contents: write

jobs:
  release:
    name: Create Release on Version Bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract and Validate Version
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          # Validate version layout (must be strict X.Y.Z format for official releases)
          IS_OFFICIAL=$(python3 -c "import re; print('true' if re.match(r'^[0-9]+\.[0-9]+\.[0-9]+$', '${VERSION}') else 'false')")
          echo "is_official=${IS_OFFICIAL}" >> $GITHUB_OUTPUT

          # Enforce strict x.x.x layout on main branch
          if [ "${{ github.ref_name }}" = "main" ] && [ "$IS_OFFICIAL" = "false" ]; then
            echo "::error::Releases on main branch must follow strict x.x.x layout (e.g., 1.0.0, 1.0.1). Found invalid version: ${VERSION}"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure Git Tag Exists
        if: steps.get_version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG does not exist locally, creating tag..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            echo "Pushing tag $TAG to origin..."
            git push origin "$TAG" || echo "::warning::Failed to push tag $TAG. Ensure GitHub Actions or GITHUB_TOKEN has permission to create tags in Repository Rulesets."
          fi

      - name: Create GitHub Release
        if: steps.get_version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          prerelease: ${{ steps.get_version.outputs.is_official == 'false' }}
          make_latest: ${{ steps.get_version.outputs.is_official == 'true' }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
