name: Auto Release

on:
  push:
    branches:
      - main
      - rc
      - 'release/**'
      - 'rc/**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.vscode/**'
      - '.githooks/**'
      - '.github/CODEOWNERS'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release on Version Bump
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.get_version.outputs.exists == 'false' }}
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      is_official: ${{ steps.get_version.outputs.is_official }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract and Validate Version
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          # Validate version layout (must be strict X.Y.Z format for official releases)
          IS_OFFICIAL=$(python3 -c "import re; print('true' if re.match(r'^[0-9]+\.[0-9]+\.[0-9]+$', '${VERSION}') else 'false')")
          echo "is_official=${IS_OFFICIAL}" >> $GITHUB_OUTPUT

          # Enforce strict x.x.x layout on main branch
          if [ "${{ github.ref_name }}" = "main" ] && [ "$IS_OFFICIAL" = "false" ]; then
            echo "::error::Releases on main branch must follow strict x.x.x layout (e.g., 1.0.0, 1.0.1). Found invalid version: ${VERSION}"
            exit 1
          fi

          # Extract curated changelog notes for this version from CHANGELOG.md
          VERSION="$VERSION" python3 -c "
          import re, os
          from pathlib import Path
          content = Path('CHANGELOG.md').read_text(encoding='utf-8')
          version = os.environ['VERSION']
          pattern = rf'##\s*\[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else ''
          Path('release_notes.md').write_text(notes, encoding='utf-8')
          "

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure Git Tag Exists
        if: steps.get_version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG does not exist locally, creating tag..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            echo "Pushing tag $TAG to origin..."
            git push origin "$TAG" || echo "::warning::Failed to push tag $TAG. Ensure GitHub Actions or GITHUB_TOKEN has permission to create tags in Repository Rulesets."
          fi

      - name: Create GitHub Release
        if: steps.get_version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.get_version.outputs.is_official == 'false' }}
          make_latest: ${{ steps.get_version.outputs.is_official == 'true' }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ needs.release.outputs.is_official == 'true' }}
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=rc,enable=${{ needs.release.outputs.is_official == 'false' }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
