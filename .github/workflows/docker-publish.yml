name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'rc/**'
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.vscode/**'
      - '.githooks/**'
      - '.github/CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && !contains(steps.get_version.outputs.version, 'rc') }}
            type=raw,value=v${{ steps.get_version.outputs.version }}
            type=raw,value=${{ steps.get_version.outputs.version }}
            type=raw,value=rc,enable=${{ contains(steps.get_version.outputs.version, 'rc') }}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
