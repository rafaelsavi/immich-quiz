services:
  immich-quiz:
    image: ghcr.io/rafaelsavi/immich-quiz:latest
    container_name: immich-quiz
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      IMMICH_SERVER_URL: "https://photos.example.com/api"
      IMMICH_LIBRARIES: '{"Family": "your-api-key-here"}'
      APP_PORT: "8010"
    volumes:
      - ./data:/app/data
