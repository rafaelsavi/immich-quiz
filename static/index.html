<!DOCTYPE html>
<html lang="{{LANG_CODE}}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{{APP_TITLE}}</title>
  <meta name="description" content="Multiplayer photo quiz game powered by your Immich photos." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Immich Quiz" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
  <!-- Favicon and App Icons -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png" />
  <link rel="shortcut icon" href="/static/favicons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/apple-touch-icon.png" />
  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/css/style.css?v=8" />
</head>

<body>
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
  <div class="bg-shape bg-1"></div>
  <div class="bg-shape bg-2"></div>
  <main class="app-shell">
    <header class="app-header">
      <div class="header-main">
        <h1>{{APP_HEADING}}</h1>
        <p>{{APP_TAGLINE}}</p>
      </div>
      <div class="header-controls">
        <button type="button" id="pwa-install-btn" class="header-icon-btn pwa-install-btn hidden"
          data-i18n-title="pwa.install_title" data-i18n-aria-label="pwa.install_title"
          title="Install App" aria-label="Install App">
          <span id="pwa-install-icon">📲</span>
        </button>
        <button type="button" id="lang-toggle-btn" class="header-icon-btn lang-toggle-btn" title="Language: English"
          aria-label="Switch Language">
          <span id="lang-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" class="flag-svg"
              aria-hidden="true">
              <rect width="60" height="60" fill="#012169" />
              <path d="M0,0 L60,60 M60,0 L0,60" stroke="#FFFFFF" stroke-width="10" />
              <path d="M0,0 L60,60 M60,0 L0,60" stroke="#C8102E" stroke-width="6" />
              <path d="M30,0 V60 M0,30 H60" stroke="#FFFFFF" stroke-width="16" />
              <path d="M30,0 V60 M0,30 H60" stroke="#C8102E" stroke-width="10" />
            </svg></span>
        </button>
        <button type="button" id="audio-toggle-btn" class="header-icon-btn audio-toggle-btn"
          title="Toggle Sound Effects" aria-label="Toggle Sound Effects">
          <span id="audio-icon">🔊</span>
        </button>
      </div>
    </header>

    <section id="setup-card" class="card">
      <h2 data-i18n="setup.heading">Game Setup</h2>
      <form id="setup-form">
        <div class="form-group player-input-group">
          <div class="field-head-inline">
            <label data-i18n="setup.players_label">Players</label>
            <span class="player-count-badge" id="player-count-badge">1 player (Solo)</span>
          </div>
          <div id="player-input-root" class="player-input-root"></div>
          <input type="hidden" id="players" name="players" value="" />
        </div>

        <!-- Expandable Media & Library Filters Section -->
        <div class="filters-accordion" id="filters-accordion">
          <div class="filters-accordion-header" id="filters-accordion-header">
            <button type="button" class="accordion-toggle-btn" id="filters-toggle-btn" aria-expanded="false" aria-controls="filters-accordion-content">
              <div class="accordion-title-wrap">
                <span class="accordion-icon">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                  </svg>
                </span>
                <span class="accordion-title" data-i18n="setup.filters_heading">Library & Photo Filters</span>
              </div>
              <span class="filters-summary-badge" id="filters-summary-badge"
                data-i18n="setup.filters_summary_default">All media</span>
            </button>
            <div class="accordion-meta-wrap">
              <button type="button" class="sync-library-btn" id="sync-library-btn"
                title="Sync metadata from Immich">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"
                  class="sync-icon">
                  <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
                </svg>
                <span id="sync-btn-label">Sync</span>
              </button>
              <span class="select-arrow accordion-arrow" id="accordion-arrow-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
            </div>
          </div>

          <div class="filters-accordion-content hidden" id="filters-accordion-content">
            <!-- Row 1: Library & Albums -->
            <div class="grid-2">
              <div class="library-select-group">
                <div class="field-head-inline">
                  <label data-i18n="setup.libraries_label">Libraries</label>
                </div>
                <div id="library-multi-select" class="multi-select"></div>
                <!-- Photo Sources / Ownership -->
                <div class="filter-sources-row">
                  <label class="filter-source-pill" id="label-include-shared" for="include-shared-checkbox">
                    <input type="checkbox" id="include-shared-checkbox" />
                    <span data-i18n="setup.include_shared_photos">Include shared photos</span>
                  </label>
                </div>
              </div>
              <div class="album-select-group">
                <label data-i18n="setup.album_label">Album</label>
                <div id="album-multi-select" class="multi-select"></div>
              </div>
            </div>

            <!-- Row 2: Date Range Slider -->
            <div class="form-group date-slider-group">
              <div class="field-head-inline">
                <label data-i18n="setup.date_range_label">Date Range</label>
                <span class="slider-value-readout" id="date-slider-readout">All Time</span>
              </div>
              <div class="range-slider-wrap" id="date-range-slider">
                <div class="range-slider-track">
                  <div class="range-slider-fill" id="date-slider-fill"></div>
                </div>
                <input type="range" class="range-thumb thumb-min" id="date-slider-min" min="0" max="100" value="0" />
                <input type="range" class="range-thumb thumb-max" id="date-slider-max" min="0" max="100" value="100" />
              </div>
              <div class="range-slider-ticks">
                <span id="date-slider-bound-min">-</span>
                <span id="date-slider-bound-max">-</span>
              </div>
            </div>

            <!-- Row 3: Geographic & People Filters -->
            <div class="grid-3 filters-sub-grid">
              <div>
                <label data-i18n="setup.countries_label">Countries</label>
                <div id="country-multi-select" class="multi-select"></div>
              </div>
              <div>
                <label data-i18n="setup.cities_label">Cities</label>
                <div id="city-multi-select" class="multi-select"></div>
              </div>
              <div>
                <div class="field-head-inline">
                  <label data-i18n="setup.people_label">People</label>
                  <div class="people-mode-toggle hidden" id="people-mode-toggle" title="Match mode for selected people">
                    <button type="button" class="people-mode-btn active" data-people-mode="ANY"
                      data-i18n="setup.people_mode_any">Any</button>
                    <button type="button" class="people-mode-btn" data-people-mode="ALL"
                      data-i18n="setup.people_mode_all">All</button>
                  </div>
                </div>
                <div id="people-multi-select" class="multi-select"></div>
              </div>
            </div>

            <!-- Filter Actions -->
            <div class="filters-footer-actions">
              <div id="preflight-count" class="preflight-count hidden" aria-live="polite"></div>
              <button type="button" class="btn-text-action" id="reset-filters-btn" data-i18n="setup.reset_filters">
                Reset filters
              </button>
            </div>
          </div>
        </div>

        <div class="form-group mode-selection-group">
          <label data-i18n="setup.game_mode_label">Game Mode</label>
          <div class="mode-buttons" id="game-mode-selector">
            <button type="button" class="mode-btn active" data-mode="pinpoint" id="mode-pinpoint-btn">
              <span class="mode-title" data-i18n="mode.pinpoint">Pinpoint</span>
              <span class="mode-desc" data-i18n="mode.pinpoint_desc">1 photo per round. Place a pin on the map & guess
                the date.</span>
            </button>
            <button type="button" class="mode-btn" data-mode="album_shuffle" id="mode-album-shuffle-btn">
              <span class="mode-title" data-i18n="mode.album_shuffle">Album Shuffle</span>
              <span class="mode-desc" data-i18n="mode.album_shuffle_desc">3 photos per round. Match photos to map pins &
                sort the timeline.</span>
            </button>
          </div>
        </div>

        <div class="form-group game-settings-group">
          <div class="field-head-inline">
            <label data-i18n="setup.game_settings_label">What to Guess</label>
            <span class="field-hint-badge" data-i18n="setup.challenges_hint">Select 1 or both</span>
          </div>
          <div id="game-settings-container" class="game-settings-container">
            <!-- Dynamically populated by active game mode module (e.g. pinpoint.js, album_shuffle.js) -->
          </div>
        </div>

        <div class="form-group match-settings-group">
          <div class="grid-2 round-settings-grid">
            <div>
              <label data-i18n="setup.rounds_label">Rounds</label>
              <select id="round-count">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
              </select>
            </div>
            <div>
              <label data-i18n="setup.round_length_label">Round Length</label>
              <select id="round-length">
                <option value="30s" data-i18n="setup.round_30s">30s</option>
                <option value="1m" selected data-i18n="setup.round_1m">1 min</option>
                <option value="2m" data-i18n="setup.round_2m">2 min</option>
                <option value="5m" data-i18n="setup.round_5m">5 min</option>
                <option value="unlimited" data-i18n="setup.round_unlimited">Unlimited</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" id="start-match-btn" class="btn-primary" data-i18n="setup.start_btn">Start Match</button>
      </form>
    </section>

    <section id="game-card" class="card hidden">
      <div id="round-meta" class="round-meta"></div>

      <div id="pass-overlay" class="overlay hidden">
        <div class="overlay-content">
          <h3 id="overlay-title">Pass device</h3>
          <p id="overlay-subtitle">Hand the device to the next player before revealing the image.</p>
          <button id="ready-btn" class="btn-primary" data-i18n="game.ready_btn">I'm Ready</button>
        </div>
      </div>

      <div id="media-frame" class="media-frame hidden">
        <p id="media-placeholder" class="media-placeholder" data-i18n="game.media_placeholder">Photo hidden until
          you
          press "I'm Ready".</p>
        <img id="quiz-image" class="hidden" alt="Quiz media" />
        <button type="button" id="quiz-image-fullscreen" class="map-fullscreen-btn hidden" aria-pressed="false"
          title="Toggle fullscreen image" data-i18n-title="game.fullscreen_image_title">
          <svg class="fs-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
        <div class="fullscreen-timer" id="fs-timer-image">
          <div class="fs-timer-head">
            <span class="timer-title-wrap">
              <svg class="timer-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span class="fs-timer-label"></span>
            </span>
            <span class="fs-timer-remaining"></span>
          </div>
          <div class="fs-timer-track">
            <div class="fs-timer-fill"></div>
          </div>
        </div>
      </div>

      <template id="tmpl-mode-pinpoint">
        <div id="pinpoint-ui">
          <div class="grid-2 round-guess-layout">
            <div id="map-guess-wrap" class="hidden">
              <div class="field-head">
                <label data-i18n="game.location_guess_label">Location Guess</label>
              </div>
              <div id="guess-map-shell" class="map-shell">
                <div id="guess-map"></div>
                <button type="button" id="guess-map-fullscreen" class="map-fullscreen-btn" aria-pressed="false"
                  title="Toggle fullscreen map" data-i18n-title="game.fullscreen_map_title">
                  <svg class="fs-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                    stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                  </svg>
                </button>
                <div class="fullscreen-timer" id="fs-timer-guess-map">
                  <div class="fs-timer-head">
                    <span class="timer-title-wrap">
                      <svg class="timer-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                      </svg>
                      <span class="fs-timer-label"></span>
                    </span>
                    <span class="fs-timer-remaining"></span>
                  </div>
                  <div class="fs-timer-track">
                    <div class="fs-timer-fill"></div>
                  </div>
                </div>
              </div>
            </div>
            <div id="date-guess-wrap" class="hidden">
              <label data-i18n="game.date_guess_label">Date Guess (year / month)</label>
              <div class="grid-2 date-guess-grid">
                <select id="date-guess-year" aria-label="Guessed year"></select>
                <select id="date-guess-month" aria-label="Guessed month"></select>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template id="tmpl-mode-album-shuffle">
        <div id="album-shuffle-ui" class="hidden"></div>
      </template>

      <div id="guessing-ui">
        <div id="mode-active-host"></div>

        <button id="submit-answer" class="btn-primary" data-i18n="game.submit_btn">Submit Answer</button>

        <div class="timer-row">
          <div class="timer-head">
            <span class="timer-title-wrap">
              <svg class="timer-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span id="timer-label"></span>
            </span>
            <span id="timer-remaining"></span>
          </div>
          <div id="timer-track" class="timer-track">
            <div id="timer-fill" class="timer-fill"></div>
          </div>
          <p id="timeout-notice" class="timeout-notice hidden"></p>
        </div>

        <div class="game-actions">
          <button type="button" id="game-restart-btn" class="btn-danger" data-i18n="game.restart_btn">Restart</button>
          <button type="button" id="game-exit-btn" class="btn-danger" data-i18n="game.exit_btn">Exit</button>
        </div>
      </div>

      <div id="reveal-ui" class="hidden">
        <div id="pinpoint-reveal-ui">
          <div id="reveal-actual" class="reveal-actual"></div>
          <div id="reveal-legend" class="reveal-legend"></div>
          <div class="field-head" id="reveal-map-head">
            <label data-i18n="reveal.map_label">Round Map</label>
          </div>
          <div id="reveal-map-shell" class="map-shell">
            <div id="reveal-map"></div>
            <button type="button" id="reveal-map-fullscreen" class="map-fullscreen-btn" aria-pressed="false"
              title="Toggle fullscreen map" data-i18n-title="game.fullscreen_map_title">
              <svg class="fs-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
              </svg>
            </button>
          </div>
          <div class="table-scroll">
            <table id="reveal-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <button id="next-round" class="btn-primary" data-i18n="reveal.next_round_btn">Next Round</button>
          <div class="game-actions">
            <button type="button" id="reveal-restart-btn" class="btn-danger"
              data-i18n="game.restart_btn">Restart</button>
            <button type="button" id="reveal-exit-btn" class="btn-danger" data-i18n="game.exit_btn">Exit</button>
          </div>
        </div>
        <div id="album-shuffle-reveal-ui" class="hidden"></div>
      </div>
    </section>

    <section id="summary-card" class="card hidden">
      <h2 data-i18n="summary.heading">Match Results</h2>
      <div id="summary-meta" class="summary-meta"></div>
      <div id="summary-winner" class="summary-winner"></div>
      <div class="table-scroll">
        <table id="summary-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="field-head hidden" id="journey-map-head">
        <label data-i18n="summary.journey_map_heading">World Journey Map</label>
      </div>
      <div id="journey-map-shell" class="map-shell hidden">
        <div id="journey-map"></div>
        <button type="button" id="journey-map-fullscreen" class="map-fullscreen-btn" aria-pressed="false"
          title="Toggle fullscreen map" data-i18n-title="game.fullscreen_map_title">
          <svg class="fs-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>
      <div class="polaroids-section">
        <div class="field-head">
          <label data-i18n="summary.polaroids_heading">Match Memory Cards</label>
        </div>
        <div id="polaroid-gallery" class="polaroid-grid"></div>
      </div>

      <div class="summary-actions">
        <button id="new-match" class="btn-primary" data-i18n="summary.new_match_btn">Start New Match</button>
        <button id="share-summary-btn" class="btn-secondary" data-i18n="summary.share_btn">Share Match</button>
      </div>
    </section>

    <section id="leaderboard-card" class="card">
      <div class="leaderboard-head">
        <div class="leaderboard-title-group">
          <h2 data-i18n="leaderboard.heading">Leaderboard</h2>
          <span id="leaderboard-scope-pill" class="leaderboard-scope-pill"></span>
        </div>
        <button id="refresh-leaderboard" class="btn-secondary" data-i18n="leaderboard.refresh_btn">Refresh</button>
      </div>
      <div class="table-scroll">
        <table id="leaderboard-table">
          <thead>
            <tr>
              <th data-sort="played_at" data-i18n="leaderboard.col_played_at">Played At<span class="sort-arrow"
                  aria-hidden="true"></span></th>
              <th data-sort="player_name" data-i18n="leaderboard.col_player">Player<span class="sort-arrow"
                  aria-hidden="true"></span></th>
              <th data-sort="accuracy_pct" data-i18n="leaderboard.col_accuracy">Accuracy %<span class="sort-arrow"
                  aria-hidden="true"></span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <footer class="app-footer">
      {{APP_VERSION_BADGE}}
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>

</html>
